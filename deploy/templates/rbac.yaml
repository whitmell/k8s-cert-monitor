{{- range $index, $target := .Values.targets }}
{{- $resource := ternary "secrets" "configmaps" (eq $target.kind "secret") }}
{{- $readerName := printf "%s-reader-%d" (include "cert-inventory.fullname" $ | trunc 45 | trimSuffix "-") $index | trunc 63 | trimSuffix "-" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $readerName }}
  namespace: {{ $target.namespace }}
  labels:
    {{- include "cert-inventory.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [{{ $resource | quote }}]
    verbs: ["get"]
    resourceNames: [{{ $target.name | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $readerName }}
  namespace: {{ $target.namespace }}
  labels:
    {{- include "cert-inventory.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $readerName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-inventory.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
