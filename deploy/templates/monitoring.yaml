{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cert-inventory.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-inventory.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "cert-inventory.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.interval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cert-inventory.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-inventory.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: cert-inventory
      rules:
        - alert: CertificateExpiresWithin30Days
          expr: |
            (certinv_cert_not_after_seconds - time() < 30 * 86400)
              and (certinv_cert_not_after_seconds - time() >= 14 * 86400)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ "{{" }} $labels.subject_CN {{ "}}" }} expires in under 30 days"
            description: >-
              {{ "{{" }} $labels.cert_resource {{ "}}" }} key {{ "{{" }} $labels.cert_key {{ "}}" }} in namespace
              {{ "{{" }} $labels.cert_namespace {{ "}}" }} (serial {{ "{{" }} $labels.serial_number {{ "}}" }}) expires in
              {{ "{{" }} $value | humanizeDuration {{ "}}" }}.
        - alert: CertificateExpiresWithin14Days
          expr: |
            (certinv_cert_not_after_seconds - time() < 14 * 86400)
              and (certinv_cert_not_after_seconds - time() >= 0)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ "{{" }} $labels.subject_CN {{ "}}" }} expires in under 14 days"
            description: >-
              {{ "{{" }} $labels.cert_resource {{ "}}" }} key {{ "{{" }} $labels.cert_key {{ "}}" }} in namespace
              {{ "{{" }} $labels.cert_namespace {{ "}}" }} (serial {{ "{{" }} $labels.serial_number {{ "}}" }}) expires in
              {{ "{{" }} $value | humanizeDuration {{ "}}" }}.
        - alert: CertificateExpired
          expr: certinv_cert_not_after_seconds - time() < 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ "{{" }} $labels.subject_CN {{ "}}" }} has expired"
            description: >-
              {{ "{{" }} $labels.cert_resource {{ "}}" }} key {{ "{{" }} $labels.cert_key {{ "}}" }} in namespace
              {{ "{{" }} $labels.cert_namespace {{ "}}" }} (serial {{ "{{" }} $labels.serial_number {{ "}}" }}) is expired.
        - alert: CertInventoryTargetFailing
          expr: certinv_target_up == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "cert-inventory cannot read {{ "{{" }} $labels.cert_resource {{ "}}" }}"
            description: >-
              {{ "{{" }} $labels.cert_resource {{ "}}" }} key {{ "{{" }} $labels.cert_key {{ "}}" }} in namespace
              {{ "{{" }} $labels.cert_namespace {{ "}}" }} failed with reason "{{ "{{" }} $labels.reason {{ "}}" }}".
              forbidden usually means the Role/RoleBinding was not updated after editing targets.
        - alert: CertInventoryTargetsFileInvalid
          expr: certinv_targets_file_ok == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "cert-inventory targets.txt could not be parsed"
            description: "{{ "{{" }} $labels.error {{ "}}" }}"
        - alert: CertInventoryNotScanning
          expr: |
            (time() - certinv_last_scan_timestamp_seconds > 1800)
              or absent(certinv_last_scan_timestamp_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "cert-inventory has not completed a scan in 30 minutes"
            description: >-
              Certificate expiry data is stale or missing. Check the cert-inventory
              pod in the cert-inventory namespace.
{{- end }}
