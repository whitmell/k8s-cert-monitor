apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cert-inventory.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-inventory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cert-inventory.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cert-inventory.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "cert-inventory.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cert-inventory
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-I", "/app/cert_inventory.py"]
          env:
            - name: CERTINV_TARGETS
              value: /config/targets.txt
            - name: CERTINV_SCAN_INTERVAL_SECONDS
              value: {{ .Values.scanIntervalSeconds | quote }}
            - name: TMPDIR
              value: /tmp
          ports:
            - name: metrics
              containerPort: 9793
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 120
            periodSeconds: 60
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: targets
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: {{ include "cert-inventory.fullname" . }}-app
        - name: targets
          configMap:
            name: {{ include "cert-inventory.fullname" . }}-targets
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
