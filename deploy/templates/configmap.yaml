apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cert-inventory.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-inventory.labels" . | nindent 4 }}
data:
  cert_inventory.py: |-
{{ .Files.Get "cert_inventory.py" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cert-inventory.fullname" . }}-targets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-inventory.labels" . | nindent 4 }}
data:
  targets.txt: |-
{{ range .Values.targets }}
    {{ .namespace }} {{ .kind }} {{ .name }} {{ .key }}
{{- end }}
