# Deploy:   kubectl apply -k deploy
#
# No `namespace:` field on purpose: the RBAC Roles live in the namespaces of
# the monitored objects, and a kustomize namespace override would move them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app.yaml
  - rbac-targets.yaml
  - monitoring.yaml

# The exporter is a stdlib-only Python script, so any approved Python 3.9+
# image works. Set newName to the full path in your registry.
images:
  - name: python-ubi-min
    newName: base-images-docker/python-ubi-min
    newTag: 3.2.0-p3.14-ubi9-build.69

# Name hashes make the Deployment roll automatically when the script or the
# targets list changes.
configMapGenerator:
  - name: cert-inventory-app
    namespace: cert-inventory
    files:
      - cert_inventory.py
  - name: cert-inventory-targets
    namespace: cert-inventory
    files:
      - targets.txt

labels:
  - pairs:
      app.kubernetes.io/part-of: cert-inventory
