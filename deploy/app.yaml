apiVersion: v1
kind: Namespace
metadata:
  name: cert-inventory
  labels:
    app.kubernetes.io/name: cert-inventory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-inventory
  namespace: cert-inventory
  labels:
    app.kubernetes.io/name: cert-inventory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-inventory
  namespace: cert-inventory
  labels:
    app.kubernetes.io/name: cert-inventory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-inventory
    spec:
      serviceAccountName: cert-inventory
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cert-inventory
          # Replaced by the `images:` entry in kustomization.yaml.
          image: python-ubi-min
          # -I: isolated mode (ignore PYTHON* env vars and user site-packages).
          command: ["python3", "-I", "/app/cert_inventory.py"]
          env:
            - name: CERTINV_TARGETS
              value: /config/targets.txt
            - name: CERTINV_SCAN_INTERVAL_SECONDS
              value: "300"
            - name: TMPDIR
              value: /tmp
          ports:
            - name: metrics
              containerPort: 9793
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            # Fails only if scans stop completing (3 intervals + 60s).
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 120
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: targets
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: cert-inventory-app
        - name: targets
          configMap:
            name: cert-inventory-targets
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cert-inventory
  namespace: cert-inventory
  labels:
    app.kubernetes.io/name: cert-inventory
spec:
  selector:
    app.kubernetes.io/name: cert-inventory
  ports:
    - name: metrics
      port: 9793
      targetPort: metrics
