replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: base-images-docker/python-ubi-min
  tag: 3.2.0-p3.14-ubi9-build.69
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""

targets:
  - namespace: kube-system
    kind: configmap
    name: kube-root-ca.crt
    key: ca.crt

scanIntervalSeconds: 300

service:
  type: ClusterIP
  port: 9793

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

monitoring:
  enabled: false
  labels: {}
  interval: 60s
  scrapeTimeout: 30s

# Grafana dashboards (Certificate Inventory and Certificate Detail), shipped as a
# ConfigMap that the Grafana dashboard sidecar loads. Needs Grafana 10 or later.
dashboards:
  enabled: true
  # Namespace the Grafana sidecar watches. Empty means the release namespace.
  # Rancher Monitoring: cattle-dashboards. Whoever runs helm needs permission
  # to create ConfigMaps there.
  namespace: cattle-dashboards
  # Must match the sidecar's label setting (Rancher Monitoring: grafana_dashboard "1").
  label: grafana_dashboard
  labelValue: "1"
  # Extra annotations, for example a folder when the sidecar sets folderAnnotation:
  #   grafana_folder: Certificates
  annotations: {}
