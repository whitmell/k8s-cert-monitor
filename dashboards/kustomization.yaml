# Ships both dashboards as ConfigMaps for the Grafana dashboard sidecar.
#
#   kubectl apply -k dashboards
#
# Set `namespace` to a namespace your Grafana sidecar watches (Rancher
# Monitoring: cattle-dashboards) and make the label match the sidecar's label
# setting (default: grafana_dashboard). Alternatively, import the two JSON
# files through the Grafana UI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cattle-dashboards

configMapGenerator:
  - name: cert-inventory-dashboards
    files:
      - certificate-inventory.json
      - certificate-detail.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
